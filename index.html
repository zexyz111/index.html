<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Han</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    color:white;
}

/* 🎥 Видео фон */
video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    filter:brightness(0.8);
    transition: transform 0.2s ease;
}

/* 🌫 затемнение */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.35);
    z-index:-2;
}

/* 🔮 LIQUID GLASS CARD */
.glass{
    position:relative;
    padding:60px 80px;
    border-radius:30px;

    background:rgba(255,255,255,0.08);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    border:1px solid rgba(255,255,255,0.2);

    box-shadow:
        0 0 40px rgba(255,255,255,0.1),
        0 20px 60px rgba(0,0,0,0.6);

    text-align:center;
    animation: fadeIn 1.5s ease forwards;
    opacity:0;
}

/* ✨ Блик сверху */
.glass::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:50%;
    border-radius:30px;
    background:linear-gradient(
        to bottom,
        rgba(255,255,255,0.25),
        transparent
    );
    pointer-events:none;
}

/* 🔥 Заголовок */
.glass h1{
    font-size:70px;
    letter-spacing:6px;
    text-transform:uppercase;
    text-shadow:0 0 25px rgba(255,255,255,0.8);
}

/* 🖤 Ник */
.glass p{
    margin-top:15px;
    font-size:20px;
    opacity:0.85;
    letter-spacing:3px;
}

/* 🎬 Анимация */
@keyframes fadeIn{
    to{ opacity:1; transform:translateY(0); }
    from{ opacity:0; transform:translateY(20px); }
}

/* 📱 Адаптация */
@media(max-width:768px){
    .glass{
        padding:40px;
        width:85%;
    }
    .glass h1{
        font-size:45px;
    }
}
</style>
</head>

<body>

<video autoplay muted loop playsinline id="bgVideo">
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="glass">
    <h1>HAN</h1>
    <p>@hanmaybe</p>
</div>

<script>
/* 🌊 Параллакс */
document.addEventListener("mousemove", function(e){
    let x = (window.innerWidth / 2 - e.pageX) / 120;
    let y = (window.innerHeight / 2 - e.pageY) / 120;
    document.getElementById("bgVideo").style.transform =
        "scale(1.05) translate(" + x + "px," + y + "px)";
});
</script>

</body>
</html>
