<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Han</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    color:white;
}

/* Видео фон */
video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    transform:scale(0.93);
    filter:brightness(0.4) blur(4px) contrast(1.05);
    transition:transform 0.3s ease;
}

.overlay{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center,
            rgba(0,0,0,0.35) 0%,
            rgba(0,0,0,0.8) 80%
        );
    z-index:-2;
}

/* Glass */
.glass{
    position:relative;
    padding:70px 100px;
    border-radius:35px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(55px) saturate(180%);
    border:1px solid rgba(255,255,255,0.25);
    box-shadow:
        0 0 80px rgba(255,255,255,0.12),
        inset 0 0 40px rgba(255,255,255,0.05),
        0 30px 100px rgba(0,0,0,0.9);
    text-align:center;
}

/* Заголовок */
.glass h1{
    font-size:80px;              /* было 70 */
    letter-spacing:12px;
    transform:scaleX(1.5);       /* было 1.4 */
    transform-origin:center;
    text-shadow:
        0 0 20px rgba(255,255,255,0.9),
        0 0 40px rgba(255,255,255,0.6),
        0 0 70px rgba(255,255,255,0.3);
}

/* Ник */
.glass p{
    margin-top:18px;
    font-size:21px;              /* было 18 */
    letter-spacing:5px;
    transform:scaleX(1.1);       /* лёгкое растяжение */
    opacity:0.9;
    text-shadow:0 0 12px rgba(255,255,255,0.4);
}

/* Кнопки */
.buttons{
    margin-top:40px;
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
}

.btn{
    padding:15px 32px;
    border-radius:18px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(30px);
    border:1px solid rgba(255,255,255,0.35);
    color:white;
    text-decoration:none;
    font-size:16px;              /* было 14 */
    letter-spacing:1.5px;
    cursor:pointer;
    transition:all 0.35s ease;
}

.btn:hover{
    background:rgba(255,255,255,0.25);
    transform:translateY(-6px) scale(1.08);
    box-shadow:
        0 15px 40px rgba(0,0,0,0.8),
        0 0 25px rgba(255,255,255,0.35);
}

/* Адаптация */
@media(max-width:768px){
    .glass{
        padding:50px;
        width:90%;
    }
    .glass h1{
        font-size:55px;
        transform:scaleX(1.4);
    }
    .glass p{
        font-size:18px;
    }
}
</style>
</head>

<body>

<video autoplay muted loop playsinline id="bgVideo">
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="glass">
    <h1>HAN</h1>
    <p>@hanmaybe</p>

    <div class="buttons">
        <a href="https://t.me/hanmaybee" target="_blank" class="btn">Telegram</a>
        <button class="btn">Project</button>
        <a href="https://youtube.com" target="_blank" class="btn">Just YouTube xdd)</a>
    </div>
</div>

<script>
document.addEventListener("mousemove", function(e){
    let x=(window.innerWidth/2-e.pageX)/220;
    let y=(window.innerHeight/2-e.pageY)/220;
    document.getElementById("bgVideo").style.transform=
        "scale(0.93) translate("+x+"px,"+y+"px)";
});
</script>

</body>
</html>
