<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Han</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

/* 🎥 Видео фон */
video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    filter:brightness(0.85);
    transition: transform 0.2s ease;
}

/* 🌑 Градиент поверх */
.overlay{
    position:fixed;
    inset:0;
    background:linear-gradient(
        to bottom,
        rgba(0,0,0,0.2),
        rgba(0,0,0,0.5)
    );
    z-index:-2;
}

/* ✨ Контент */
.content{
    animation: fadeIn 2s ease forwards;
    opacity:0;
}

/* 🔥 Заголовок */
.content h1{
    font-size:70px;
    letter-spacing:6px;
    text-transform:uppercase;
    text-shadow:0 0 20px rgba(255,255,255,0.6);
    animation: glow 3s infinite alternate;
}

/* 🖤 Подпись */
.content p{
    margin-top:15px;
    font-size:20px;
    opacity:0.8;
    letter-spacing:2px;
}

/* 🎬 Анимации */
@keyframes fadeIn{
    to{ opacity:1; }
}

@keyframes glow{
    from{ text-shadow:0 0 10px rgba(255,255,255,0.4); }
    to{ text-shadow:0 0 25px rgba(255,255,255,0.9); }
}

/* 📱 Адаптация */
@media(max-width:768px){
    .content h1{
        font-size:45px;
    }
    .content p{
        font-size:16px;
    }
}
</style>
</head>

<body>

<video autoplay muted loop playsinline id="bgVideo">
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="content">
    <h1>HAN</h1>
    <p>@hanmaybe</p>
</div>

<script>
/* 🌊 Лёгкий Parallax */
document.addEventListener("mousemove", function(e){
    let x = (window.innerWidth / 2 - e.pageX) / 100;
    let y = (window.innerHeight / 2 - e.pageY) / 100;
    document.getElementById("bgVideo").style.transform =
        "scale(1.05) translate(" + x + "px," + y + "px)";
});
</script>

</body>
</html>
