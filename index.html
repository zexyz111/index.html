<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hanmaybe</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;500;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    overflow:hidden;
    background:#000;
}

/* Видео фон */
.video-bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    filter:brightness(0.4) blur(2px);
}

/* Затемнение */
.overlay{
    position:fixed;
    inset:0;
    background:linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0.9));
    z-index:-2;
}

/* Grain эффект */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background-image:url("https://grainy-gradients.vercel.app/noise.svg");
    opacity:0.05;
    z-index:-1;
}

/* Контент */
.container{
    max-width:700px;
    padding:30px;
    animation:fadeUp 1.5s ease;
}

@keyframes fadeUp{
    from{opacity:0; transform:translateY(40px);}
    to{opacity:1; transform:translateY(0);}
}

h1{
    font-size:clamp(40px,8vw,90px);
    font-weight:200;
    letter-spacing:8px;
    text-transform:uppercase;
    margin-bottom:25px;
    color:#fff;
    text-shadow:0 0 20px rgba(255,255,255,0.25);
}

p{
    font-size:15px;
    color:#aaa;
    margin-bottom:50px;
    line-height:1.8;
    letter-spacing:2px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.buttons a,
.buttons button{
    padding:14px 30px;
    border-radius:40px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(0,0,0,0.5);
    backdrop-filter:blur(10px);
    color:white;
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    text-decoration:none;
    cursor:pointer;
    transition:0.4s ease;
    position:relative;
}

.buttons a:hover,
.buttons button:hover{
    border-color:#fff;
    box-shadow:0 0 20px rgba(255,255,255,0.3);
    transform:translateY(-3px);
}

/* Модалка */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:0.3s ease;
}

.modal.active{
    opacity:1;
    pointer-events:all;
}

.modal-box{
    padding:50px 80px;
    border-radius:20px;
    background:rgba(20,20,20,0.9);
    backdrop-filter:blur(20px);
    font-size:20px;
    letter-spacing:4px;
    text-transform:uppercase;
    border:1px solid rgba(255,255,255,0.1);
}
</style>
</head>
<body>

<video class="video-bg" autoplay muted loop playsinline>
    <source src="background.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">
    <h1>@hanmaybe</h1>

    <p>
        Digital creator. Minimal mind.<br>
        Building bots and quiet projects.
    </p>

    <div class="buttons">
        <a href="https://t.me/hanmaybe" target="_blank">Telegram</a>
        <button onclick="openGithub()">GitHub</button>
        <button onclick="openProjects()">Проекты</button>
    </div>
</div>

<div class="modal" id="modal" onclick="closeModal()">
    <div class="modal-box" id="modalText"></div>
</div>

<script>
function openGithub(){
    document.getElementById("modalText").innerText = "предпочитаю не говорить";
    document.getElementById("modal").classList.add("active");
}

function openProjects(){
    document.getElementById("modalText").innerText = "Скоро";
    document.getElementById("modal").classList.add("active");
}

function closeModal(){
    document.getElementById("modal").classList.remove("active");
}
</script>

</body>
</html>
