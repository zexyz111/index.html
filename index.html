<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Han</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    color:white;
}

/* Видео фон */
video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    transform:scale(0.93);
    filter:brightness(0.4) blur(4px) contrast(1.05);
}

/* Затемняющий слой */
.overlay{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center,
            rgba(0,0,0,0.45) 0%,
            rgba(0,0,0,0.9) 80%
        );
    z-index:-2;
}

/* ОБНОВЛЁННАЯ ТАБЛИЧКА */
.glass{
    position:relative;
    padding:55px 75px;
    border-radius:28px;

    /* темнее и менее прозрачная */
    background:rgba(18,18,18,0.55);

    backdrop-filter:blur(45px) saturate(160%);
    border:1px solid rgba(255,255,255,0.15);

    box-shadow:
        0 0 60px rgba(0,0,0,0.7),
        inset 0 0 30px rgba(255,255,255,0.04),
        0 20px 60px rgba(0,0,0,0.85);

    text-align:center;
}

/* Заголовок */
.glass h1{
    font-size:80px;
    letter-spacing:12px;
    transform:scaleX(1.5);
    text-shadow:
        0 0 20px rgba(255,255,255,0.9),
        0 0 40px rgba(255,255,255,0.6),
        0 0 70px rgba(255,255,255,0.3);
}

/* Ник */
.glass p{
    margin-top:18px;
    font-size:21px;
    letter-spacing:5px;
    transform:scaleX(1.1);
    opacity:0.9;
}

/* Кнопки */
.buttons{
    margin-top:40px;
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
}

.btn{
    padding:15px 32px;
    border-radius:18px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,0.3);
    color:white;
    text-decoration:none;
    font-size:16px;
    cursor:pointer;
    transition:all 0.3s ease;
}

.btn:hover{
    background:rgba(255,255,255,0.25);
    transform:translateY(-5px) scale(1.06);
    box-shadow:
        0 15px 40px rgba(0,0,0,0.8),
        0 0 25px rgba(255,255,255,0.3);
}

/* Адаптация */
@media(max-width:768px){
    .glass{
        padding:40px 35px;
        width:85%;
    }

    .glass h1{
        font-size:55px;
        transform:scaleX(1.4);
    }

    .glass p{
        font-size:18px;
    }
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="glass">
    <h1>HAN</h1>
    <p>@hanmaybe</p>

    <div class="buttons">
        <a href="https://t.me/hanmaybee" target="_blank" class="btn">Telegram</a>
        <button class="btn">Project</button>
        <a href="https://youtube.com" target="_blank" class="btn">Just YouTube xdd)</a>
    </div>
</div>

</body>
</html>
