<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Han</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    display:grid;
    place-items:center;
    color:white;
    overflow:hidden;
}

/* Видео */
video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    filter:brightness(0.75) blur(3px);
    transition:transform 0.2s ease;
}

/* Затемнение */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:-2;
}

/* Glass */
.glass{
    position:relative;
    width:90%;
    max-width:380px;
    padding:50px 35px;
    border-radius:30px;

    background:rgba(18,18,24,0.65);
    backdrop-filter:blur(40px) saturate(140%);
    -webkit-backdrop-filter:blur(40px) saturate(140%);

    border:1px solid rgba(255,255,255,0.05);
    box-shadow:
        0 30px 80px rgba(0,0,0,0.9),
        inset 0 0 20px rgba(255,255,255,0.03);

    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;

    opacity:0;
    transform:translateY(40px) scale(0.96);
    animation:glassAppear 1.2s cubic-bezier(.2,.8,.2,1) forwards;
}

/* Блик */
.glass::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:40%;
    border-radius:30px;
    background:linear-gradient(to bottom,
        rgba(255,255,255,0.05),
        transparent);
    pointer-events:none;
}

/* HAN */
.glass h1{
    font-size:52px;
    font-weight:800;
    letter-spacing:8px;
    margin-bottom:8px;

    background:linear-gradient(90deg,#ffffff,#dcdcdc,#ffffff);
    background-size:180% auto;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 6s linear infinite;
}

/* Username — исправлен перекос */
.glass p{
    font-size:16px;
    opacity:0.8;
    margin-bottom:30px;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:2px;

    letter-spacing:2px;
}

/* Кнопки */
.buttons{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:16px;
}

.btn{
    width:100%;
    padding:14px 0;
    border-radius:16px;

    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.07);

    color:white;
    text-decoration:none;
    font-size:15px;
    font-weight:600;
    letter-spacing:2px;
    text-align:center;

    cursor:pointer;
    transition:all 0.25s ease;

    opacity:0;
    transform:translateY(20px);
    animation:btnAppear 0.8s ease forwards;
}

.btn:nth-child(1){ animation-delay:0.6s; }
.btn:nth-child(2){ animation-delay:0.8s; }
.btn:nth-child(3){ animation-delay:1s; }

.btn:hover{
    background:rgba(255,255,255,0.09);
    transform:translateY(-3px);
}

/* Popup */
.popup{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(10px);
    opacity:0;
    pointer-events:none;
    transition:0.3s ease;
}

.popup.active{
    opacity:1;
    pointer-events:auto;
}

.popup-content{
    padding:35px 50px;
    border-radius:20px;
    background:rgba(20,20,25,0.8);
    backdrop-filter:blur(30px);
    border:1px solid rgba(255,255,255,0.05);
    text-align:center;
    font-size:18px;
}

/* Анимации */
@keyframes glassAppear{
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes btnAppear{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes shine{
    0%{ background-position:0% center; }
    100%{ background-position:180% center; }
}

@media(max-width:768px){
    .glass{
        padding:40px 25px;
    }
    .glass h1{
        font-size:42px;
        letter-spacing:6px;
    }
}
</style>
</head>

<body>

<video autoplay muted loop playsinline id="bgVideo">
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="glass">
    <h1>HAN</h1>
    <p>@hanmaybe</p>

    <div class="buttons">
        <a href="https://t.me/hanmaybee" target="_blank" class="btn">Telegram</a>
        <button class="btn" onclick="openPopup()">Project</button>
        <a href="https://youtube.com" target="_blank" class="btn">Just YouTube xdd)</a>
    </div>
</div>

<div class="popup" id="popup">
    <div class="popup-content">
        Скоро 🚀
        <br><br>
        <button class="btn" onclick="closePopup()">Закрыть</button>
    </div>
</div>

<script>
document.addEventListener("mousemove", function(e){
    let x=(window.innerWidth/2-e.pageX)/120;
    let y=(window.innerHeight/2-e.pageY)/120;
    document.getElementById("bgVideo").style.transform=
        "scale(1.05) translate("+x+"px,"+y+"px)";
});

function openPopup(){
    document.getElementById("popup").classList.add("active");
}
function closePopup(){
    document.getElementById("popup").classList.remove("active");
}
</script>

</body>
</html>
