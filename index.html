<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Han</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    color:white;
}

/* 🎬 Видео фон */
video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    transform:scale(0.93);
    filter:brightness(0.4) blur(4px) contrast(1.05);
    transition:transform 0.3s ease;
}

/* 🌑 Затемнение */
.overlay{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center,
            rgba(0,0,0,0.35) 0%,
            rgba(0,0,0,0.8) 80%
        );
    z-index:-2;
}

/* 💎 Glass */
.glass{
    position:relative;
    padding:65px 90px;
    border-radius:35px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(55px) saturate(180%);
    -webkit-backdrop-filter:blur(55px) saturate(180%);
    border:1px solid rgba(255,255,255,0.25);
    box-shadow:
        0 0 80px rgba(255,255,255,0.12),
        inset 0 0 40px rgba(255,255,255,0.05),
        0 30px 100px rgba(0,0,0,0.9);
    text-align:center;
    opacity:0;
    transform:translateY(60px) scale(0.95);
    animation:glassAppear 1.3s cubic-bezier(.2,.8,.2,1) forwards;
}

/* ✨ Центрирование текста */
.title-wrapper{
    display:flex;
    justify-content:center;
}

.username-wrapper{
    display:flex;
    justify-content:center;
}

/* 🔥 HAN */
.glass h1{
    font-size:70px;
    letter-spacing:10px;
    transform:scaleX(1.4);
    transform-origin:center;
    text-align:center;
    text-shadow:
        0 0 15px rgba(255,255,255,0.9),
        0 0 30px rgba(255,255,255,0.6),
        0 0 60px rgba(255,255,255,0.3);
}

/* Ник */
.glass p{
    margin-top:15px;
    font-size:18px;
    opacity:0.85;
    letter-spacing:4px;
    text-align:center;
    text-shadow:0 0 10px rgba(255,255,255,0.4);
}

.buttons{
    margin-top:35px;
    display:flex;
    gap:18px;
    justify-content:center;
    flex-wrap:wrap;
}

.btn{
    padding:13px 28px;
    border-radius:18px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(30px);
    border:1px solid rgba(255,255,255,0.35);
    color:white;
    text-decoration:none;
    font-size:14px;
    letter-spacing:1px;
    cursor:pointer;
    transition:all 0.35s ease;
    opacity:0;
    transform:translateY(25px);
    animation:btnAppear 0.9s ease forwards;
}

.btn:nth-child(1){ animation-delay:0.7s; }
.btn:nth-child(2){ animation-delay:0.9s; }
.btn:nth-child(3){ animation-delay:1.1s; }

.btn:hover{
    background:rgba(255,255,255,0.25);
    transform:translateY(-6px) scale(1.07);
    box-shadow:
        0 15px 40px rgba(0,0,0,0.8),
        0 0 20px rgba(255,255,255,0.3);
}

@keyframes glassAppear{
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes btnAppear{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:768px){
    .glass{
        padding:45px;
        width:90%;
    }
    .glass h1{
        font-size:45px;
        transform:scaleX(1.3);
    }
}
</style>
</head>

<body>

<video autoplay muted loop playsinline id="bgVideo">
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="glass">

    <div class="title-wrapper">
        <h1>HAN</h1>
    </div>

    <div class="username-wrapper">
        <p>@hanmaybe</p>
    </div>

    <div class="buttons">
        <a href="https://t.me/hanmaybee" target="_blank" class="btn">Telegram</a>
        <button class="btn">Project</button>
        <a href="https://youtube.com" target="_blank" class="btn">Just YouTube xdd)</a>
    </div>

</div>

<script>
document.addEventListener("mousemove", function(e){
    let x=(window.innerWidth/2-e.pageX)/220;
    let y=(window.innerHeight/2-e.pageY)/220;
    document.getElementById("bgVideo").style.transform=
        "scale(0.93) translate("+x+"px,"+y+"px)";
});
</script>

</body>
</html>
