<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Han</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

/* Видео фон */
video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
    filter:brightness(0.85);
}

/* Затемнение */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.3);
    z-index:-1;
}

/* Контент */
.content h1{
    font-size:60px;
    letter-spacing:5px;
}

.content p{
    margin-top:10px;
    font-size:18px;
    opacity:0.8;
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="content">
    <h1>HAN</h1>
    <p>@hanmaybe</p>
</div>

</body>
</html>
