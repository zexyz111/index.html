<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Han</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    display:grid;
    place-items:center;
    color:white;
    overflow:hidden;
    background:black;
}

/* Видео */
video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    filter:brightness(0.65) blur(3px);
    transition:transform 0.2s ease;
}

/* Затемнение */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    z-index:-2;
}

/* GLASS */
.glass{
    position:relative;
    width:90%;
    max-width:380px;
    padding:50px 35px;
    border-radius:30px;

    background:rgba(15,15,20,0.7);
    backdrop-filter:blur(45px);
    -webkit-backdrop-filter:blur(45px);

    border:1px solid rgba(0,0,0,0.6);

    /* 🔥 Черное свечение */
    box-shadow:
        0 0 0 1px rgba(0,0,0,0.8),
        0 40px 100px rgba(0,0,0,0.95),
        inset 0 0 40px rgba(0,0,0,0.6);

    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;

    opacity:0;
    transform:translateY(40px) scale(0.96);
    animation:glassAppear 1.2s cubic-bezier(.2,.8,.2,1) forwards;
}

/* HAN */
.glass h1{
    font-size:52px;
    font-weight:800;
    letter-spacing:8px;
    margin-bottom:8px;

    color:white;

    /* 🔥 мягкое свечение текста */
    text-shadow:
        0 0 10px rgba(255,255,255,0.15),
        0 0 25px rgba(0,0,0,0.8);
}

/* Username */
.glass p{
    font-size:16px;
    opacity:0.85;
    margin-bottom:30px;
    letter-spacing:2px;

    text-shadow:
        0 0 8px rgba(255,255,255,0.1),
        0 0 20px rgba(0,0,0,0.8);
}

/* Кнопки */
.buttons{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:16px;
}

.btn{
    width:100%;
    padding:14px 0;
    border-radius:16px;

    background:rgba(255,255,255,0.04);
    border:1px solid rgba(0,0,0,0.7);

    color:white;
    text-decoration:none;
    font-size:15px;
    font-weight:600;
    letter-spacing:2px;
    text-align:center;

    cursor:pointer;
    transition:all 0.25s ease;

    opacity:0;
    transform:translateY(20px);
    animation:btnAppear 0.8s ease forwards;

    box-shadow:0 10px 30px rgba(0,0,0,0.7);
}

.btn:nth-child(1){ animation-delay:0.6s; }
.btn:nth-child(2){ animation-delay:0.8s; }
.btn:nth-child(3){ animation-delay:1s; }

.btn:hover{
    background:rgba(255,255,255,0.08);
    transform:translateY(-3px);
}

/* Анимации */
@keyframes glassAppear{
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes btnAppear{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:768px){
    .glass{
        padding:40px 25px;
    }
    .glass h1{
        font-size:42px;
        letter-spacing:6px;
    }
}
</style>
</head>

<body>

<video autoplay muted loop playsinline id="bgVideo">
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="glass">
    <h1>HAN</h1>
    <p>@hanmaybe</p>

    <div class="buttons">
        <a href="https://t.me/hanmaybee" target="_blank" class="btn">Telegram</a>
        <a href="https://t.me/project_han" target="_blank" class="btn">Project</a>
        <a href="https://youtube.com" target="_blank" class="btn">Just YouTube xdd)</a>
    </div>
</div>

<script>
document.addEventListener("mousemove", function(e){
    let x=(window.innerWidth/2-e.pageX)/120;
    let y=(window.innerHeight/2-e.pageY)/120;
    document.getElementById("bgVideo").style.transform=
        "scale(1.05) translate("+x+"px,"+y+"px)";
});
</script>

</body>
</html>
