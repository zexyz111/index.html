<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hanmaybe</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    padding:20px;
    background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.container{
    width:100%;
    max-width:600px;
}

h1{
    font-size:clamp(36px, 8vw, 72px);
    font-weight:900;
    background:linear-gradient(90deg,#7f5af0,#2cb67d);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:20px;
}

p{
    font-size:16px;
    color:#ccc;
    margin-bottom:40px;
    line-height:1.6;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
}

.buttons a,
.buttons button{
    padding:12px 22px;
    border-radius:30px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
    color:white;
    font-size:14px;
    text-decoration:none;
    cursor:pointer;
    transition:0.3s;
}

.buttons a:hover,
.buttons button:hover{
    background:#7f5af0;
    border-color:#7f5af0;
}

/* Модалка */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:0.3s ease;
}

.modal.active{
    opacity:1;
    pointer-events:all;
}

.modal-box{
    padding:40px 60px;
    border-radius:20px;
    background:#111;
    font-size:22px;
}
</style>
</head>
<body>

<div class="container">
    <h1>@hanmaybe</h1>

    <p>
        Digital creator. Minimal mind.<br>
        Building bots, ideas and quiet projects.
    </p>

    <div class="buttons">
        <a href="#">Telegram</a>
        <a href="#">GitHub</a>
        <button onclick="openModal()">Мои проекты</button>
    </div>
</div>

<div class="modal" id="modal" onclick="closeModal()">
    <div class="modal-box">
        Скоро...
    </div>
</div>

<script>
function openModal(){
    document.getElementById("modal").classList.add("active");
}
function closeModal(){
    document.getElementById("modal").classList.remove("active");
}
</script>

</body>
</html>
