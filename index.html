<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@hanmaybe</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html,body{
    height:100%;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden;
    color:rgba(255,255,255,0.85);
}

/* Видео фон */
.bg-video{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

/* Затемнение 20% */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.2);
    z-index:-1;
}

/* Контент */
.container{
    width:90%;
    max-width:600px;
    text-align:center;
}

/* Ник */
h1{
    font-size:clamp(44px,10vw,90px);
    font-weight:700;
    letter-spacing:16px;
    text-transform:uppercase;
    margin-bottom:25px;
    color:rgba(255,255,255,0.9);
}

/* Описание */
p{
    font-size:16px;
    margin-bottom:55px;
    line-height:1.9;
    letter-spacing:3px;
    color:rgba(255,255,255,0.65);
}

/* Кнопки */
.buttons{
    display:flex;
    flex-direction:column;
    gap:22px;
}

.buttons a,
.buttons button{
    padding:18px;
    border-radius:50px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.07);
    color:rgba(255,255,255,0.8);
    font-size:14px;
    font-weight:600;
    letter-spacing:6px;
    text-transform:uppercase;
    text-decoration:none;
    cursor:pointer;
    transition:0.25s ease;
}

.buttons a:active,
.buttons button:active{
    transform:scale(0.96);
    background:rgba(255,255,255,0.14);
}

/* Модалка */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:0.3s;
}

.modal.active{
    opacity:1;
    pointer-events:auto;
}

.modal-box{
    padding:30px 40px;
    background:#111;
    border-radius:16px;
    letter-spacing:5px;
    text-transform:uppercase;
}
</style>
</head>

<body>

<video class="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="background.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">
    <h1>@hanmaybe</h1>

    <p>
        Digital creator.<br>
        Building quiet projects.
    </p>

    <div class="buttons">
        <a href="https://t.me/hanmaybe" target="_blank">Telegram</a>
        <button onclick="openGithub()">GitHub</button>
        <button onclick="openProjects()">Проекты</button>
    </div>
</div>

<div class="modal" id="modal" onclick="closeModal()">
    <div class="modal-box" id="modalText"></div>
</div>

<script>
function openGithub(){
    document.getElementById("modalText").innerText="предпочитаю не говорить";
    document.getElementById("modal").classList.add("active");
}
function openProjects(){
    document.getElementById("modalText").innerText="Скоро";
    document.getElementById("modal").classList.add("active");
}
function closeModal(){
    document.getElementById("modal").classList.remove("active");
}
</script>

</body>
</html>
