<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html, body{
    height:100%;
    width:100%;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    overflow:hidden;
    color:rgba(255,255,255,0.75);
}

/* Видео фон (стабильный) */
.video-bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
    filter:brightness(0.8) blur(3px);
}

/* Затемнение 20% */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.2);
    z-index:-1;
}

/* Центрированный контейнер */
.container{
    width:90%;
    max-width:600px;
    padding:40px 25px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

/* Ник */
h1{
    font-size:clamp(44px,10vw,90px);
    font-weight:700;
    letter-spacing:16px;
    text-transform:uppercase;
    margin-bottom:25px;
    color:rgba(255,255,255,0.9);
}

/* Описание */
p{
    font-size:16px;
    margin-bottom:55px;
    line-height:1.9;
    letter-spacing:3px;
    color:rgba(255,255,255,0.6);
}

/* Кнопки */
.buttons{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:22px;
}

.buttons a,
.buttons button{
    padding:18px;
    border-radius:50px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.06); /* fallback */
    color:rgba(255,255,255,0.75);
    font-size:14px;
    font-weight:600;
    letter-spacing:6px;
    text-transform:uppercase;
    text-decoration:none;
    cursor:pointer;
    transition:0.25s ease;
}

/* blur включится только если поддерживается */
@supports (backdrop-filter: blur(8px)) {
    .buttons a,
    .buttons button{
        backdrop-filter:blur(8px);
        background:rgba(255,255,255,0.08);
    }
}

.buttons a:active,
.buttons button:active{
    transform:scale(0.96);
    background:rgba(255,255,255,0.14);
}
</style>
