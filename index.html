<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    overflow:hidden;
    background:black;
}

/* Видео */
.video-bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
    filter:brightness(0.8) blur(4px); /* 20% темнее + мягкий blur */
}

/* ЛЁГКОЕ затемнение поверх */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.2); /* ровно 20% */
    z-index:-1;
}

/* Контент */
.container{
    width:100%;
    max-width:500px;
    padding:40px 25px;
}

/* Ник */
h1{
    font-size:clamp(42px,9vw,85px);
    font-weight:700;
    letter-spacing:14px; /* сильнее растянут */
    text-transform:uppercase;
    margin-bottom:25px;
    text-shadow:0 0 30px rgba(0,0,0,0.6);
}

/* Описание */
p{
    font-size:16px;
    margin-bottom:50px;
    line-height:1.9;
    letter-spacing:3px;
    text-shadow:0 0 20px rgba(0,0,0,0.6);
}

/* Кнопки */
.buttons{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.buttons a,
.buttons button{
    padding:18px;
    border-radius:50px;
    border:1px solid rgba(255,255,255,0.5);
    background:rgba(255,255,255,0.05);
    color:white;
    font-size:14px;
    font-weight:600;
    letter-spacing:5px;
    text-transform:uppercase;
    text-decoration:none;
    cursor:pointer;
    transition:0.25s ease;
    backdrop-filter:blur(6px);
}

.buttons a:active,
.buttons button:active{
    transform:scale(0.96);
}
</style>
