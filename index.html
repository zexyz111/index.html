<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hanmaybe</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    overflow:hidden;
    background:#000;
}

/* Видео фон */
.video-bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
    filter:brightness(0.6); /* фон теперь видно */
}

/* Лёгкое затемнение */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45); /* меньше затемнения */
    z-index:-1;
}

/* Контент */
.container{
    width:100%;
    max-width:500px;
    padding:40px 25px;
}

/* Ник */
h1{
    font-size:clamp(38px,9vw,80px);
    font-weight:600; /* жирнее */
    letter-spacing:10px; /* растянутый */
    text-transform:uppercase;
    margin-bottom:25px;
    text-shadow:0 0 15px rgba(0,0,0,0.6);
}

/* Описание */
p{
    font-size:15px;
    color:#ddd;
    margin-bottom:45px;
    line-height:1.8;
    letter-spacing:2px;
}

/* Кнопки */
.buttons{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.buttons a,
.buttons button{
    padding:16px;
    border-radius:50px;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(0,0,0,0.55);
    color:white;
    font-size:14px;
    font-weight:600;
    letter-spacing:4px; /* растянутые кнопки */
    text-transform:uppercase;
    text-decoration:none;
    cursor:pointer;
    transition:0.3s ease;
}

.buttons a:active,
.buttons button:active{
    transform:scale(0.97);
    background:rgba(255,255,255,0.15);
}

/* Модалка */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:0.3s ease;
}

.modal.active{
    opacity:1;
    pointer-events:all;
}

.modal-box{
    padding:35px 50px;
    border-radius:18px;
    background:#111;
    font-size:20px;
    letter-spacing:5px;
    text-transform:uppercase;
}
</style>
</head>
<body>

<video class="video-bg" autoplay muted loop playsinline>
    <source src="background.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">
    <h1>@hanmaybe</h1>

    <p>
        Digital creator. Minimal mind.<br>
        Building bots and quiet projects.
    </p>

    <div class="buttons">
        <a href="https://t.me/hanmaybe" target="_blank">Telegram</a>
        <button onclick="openGithub()">GitHub</button>
        <button onclick="openProjects()">Проекты</button>
    </div>
</div>

<div class="modal" id="modal" onclick="closeModal()">
    <div class="modal-box" id="modalText"></div>
</div>

<script>
function openGithub(){
    document.getElementById("modalText").innerText = "предпочитаю не говорить";
    document.getElementById("modal").classList.add("active");
}

function openProjects(){
    document.getElementById("modalText").innerText = "Скоро";
    document.getElementById("modal").classList.add("active");
}

function closeModal(){
    document.getElementById("modal").classList.remove("active");
}
</script>

</body>
</html>
