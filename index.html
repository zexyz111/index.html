<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Han</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    color:white;
}

/* 🎬 Видео фон — СВЕТЛЕЕ */
video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    transform:scale(0.95);
    filter:brightness(0.7) blur(2px) contrast(1.1);
    transition:transform 0.3s ease;
}

/* 🌤 Светлая виньетка */
.overlay{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center,
            rgba(0,0,0,0.15) 0%,
            rgba(0,0,0,0.55) 80%
        ),
        linear-gradient(to top,
            rgba(255,255,255,0.08),
            transparent 60%);
    z-index:-2;
}

/* 💎 Glass */
.glass{
    position:relative;
    padding:65px 90px;
    border-radius:35px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(55px) saturate(180%);
    border:1px solid rgba(255,255,255,0.35);
    box-shadow:
        0 0 80px rgba(255,255,255,0.15),
        inset 0 0 50px rgba(255,255,255,0.05),
        0 25px 80px rgba(0,0,0,0.6);
    text-align:center;
    opacity:0;
    transform:translateY(60px) scale(0.95);
    animation:glassAppear 1.2s cubic-bezier(.2,.8,.2,1) forwards,
              float 6s ease-in-out infinite 1.2s;
    transition:transform 0.2s ease;
}

/* ✨ Свет внутри */
.glass::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:35px;
    background:linear-gradient(120deg,
        transparent 20%,
        rgba(255,255,255,0.2),
        transparent 80%);
    transform:translateX(-100%);
    animation:shine 6s infinite;
    pointer-events:none;
}

.glass h1{
    font-size:70px;
    letter-spacing:10px;
    transform:scaleX(1.4);
    display:inline-block;
    animation:textGlow 4s ease-in-out infinite;
}

.glass p{
    margin-top:15px;
    font-size:18px;
    opacity:0.9;
    letter-spacing:4px;
}

.buttons{
    margin-top:35px;
    display:flex;
    gap:18px;
    justify-content:center;
    flex-wrap:wrap;
}

.btn{
    padding:13px 28px;
    border-radius:18px;
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,0.45);
    color:white;
    text-decoration:none;
    font-size:14px;
    letter-spacing:1px;
    cursor:pointer;
    transition:all 0.35s cubic-bezier(.2,.8,.2,1);
    opacity:0;
    transform:translateY(25px);
    animation:btnAppear 0.9s ease forwards;
}

.btn:nth-child(1){ animation-delay:0.7s; }
.btn:nth-child(2){ animation-delay:0.9s; }
.btn:nth-child(3){ animation-delay:1.1s; }

.btn:hover{
    background:rgba(255,255,255,0.35);
    transform:translateY(-6px) scale(1.08);
    box-shadow:
        0 15px 40px rgba(0,0,0,0.6),
        0 0 30px rgba(255,255,255,0.5);
}

/* Popup */
.popup{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(20px);
    opacity:0;
    pointer-events:none;
    transition:0.4s ease;
}

.popup.active{
    opacity:1;
    pointer-events:auto;
}

.popup-content{
    padding:45px 70px;
    border-radius:25px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(40px);
    border:1px solid rgba(255,255,255,0.4);
    text-align:center;
    font-size:22px;
    box-shadow:0 0 60px rgba(255,255,255,0.2);
    transform:scale(0.8);
    transition:0.4s cubic-bezier(.2,.8,.2,1);
}

.popup.active .popup-content{
    transform:scale(1);
}

/* Анимации */
@keyframes glassAppear{
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes btnAppear{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes float{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-10px); }
}

@keyframes shine{
    0%{ transform:translateX(-100%); }
    50%{ transform:translateX(100%); }
    100%{ transform:translateX(100%); }
}

@keyframes textGlow{
    0%,100%{
        text-shadow:
            0 0 20px rgba(255,255,255,0.8);
    }
    50%{
        text-shadow:
            0 0 35px rgba(255,255,255,1);
    }
}

@media(max-width:768px){
    .glass{
        padding:45px;
        width:90%;
    }
    .glass h1{
        font-size:45px;
        transform:scaleX(1.3);
    }
}
</style>
</head>

<body>

<video autoplay muted loop playsinline id="bgVideo">
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="glass" id="card">
    <h1>HAN</h1>
    <p>@hanmaybe</p>

    <div class="buttons">
        <a href="https://t.me/hanmaybee" target="_blank" class="btn">Telegram</a>
        <button class="btn" onclick="openPopup()">Project</button>
        <a href="https://youtube.com" target="_blank" class="btn">Just YouTube xdd)</a>
    </div>
</div>

<div class="popup" id="popup">
    <div class="popup-content">
        Скоро 🚀
        <br><br>
        <button class="btn" onclick="closePopup()">Закрыть</button>
    </div>
</div>

<script>
document.addEventListener("mousemove", function(e){
    let x=(window.innerWidth/2-e.pageX)/220;
    let y=(window.innerHeight/2-e.pageY)/220;

    bgVideo.style.transform =
        "scale(0.95) translate("+x+"px,"+y+"px)";

    card.style.transform =
        "translate("+(-x/3)+"px,"+(-y/3)+"px)";
});

function openPopup(){
    document.getElementById("popup").classList.add("active");
}
function closePopup(){
    document.getElementById("popup").classList.remove("active");
}
</script>

</body>
</html>
