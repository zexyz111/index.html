<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Han</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    color:white;
}

/* 🎥 Видео */
video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    filter:brightness(0.75);
    transition:transform 0.2s ease;
}

/* затемнение */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.4);
    z-index:-2;
}

/* 🔮 МУТНОЕ СТЕКЛО */
.glass{
    position:relative;
    padding:60px 80px;
    border-radius:30px;

    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(45px) saturate(160%);
    -webkit-backdrop-filter:blur(45px) saturate(160%);

    border:1px solid rgba(255,255,255,0.35);
    box-shadow:
        0 0 60px rgba(255,255,255,0.15),
        inset 0 0 30px rgba(255,255,255,0.1),
        0 25px 80px rgba(0,0,0,0.8);

    text-align:center;

    opacity:0;
    transform:translateY(40px) scale(0.95);
    animation:glassAppear 1.2s cubic-bezier(.2,.8,.2,1) forwards;
}

/* блик */
.glass::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:50%;
    border-radius:30px;
    background:linear-gradient(to bottom,
        rgba(255,255,255,0.35),
        transparent);
    pointer-events:none;
}

/* текст */
.glass h1{
    font-size:65px;
    letter-spacing:6px;
    text-shadow:0 0 25px rgba(255,255,255,0.9);
}

.glass p{
    margin-top:10px;
    font-size:18px;
    opacity:0.9;
    letter-spacing:3px;
}

/* кнопки */
.buttons{
    margin-top:30px;
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
}

.btn{
    padding:12px 25px;
    border-radius:15px;

    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(30px) saturate(150%);
    -webkit-backdrop-filter:blur(30px) saturate(150%);

    border:1px solid rgba(255,255,255,0.4);
    color:white;
    text-decoration:none;
    font-size:14px;
    letter-spacing:1px;
    cursor:pointer;
    transition:all 0.3s ease;

    opacity:0;
    transform:translateY(20px);
    animation:btnAppear 0.8s ease forwards;
}

.btn:nth-child(1){ animation-delay:0.6s; }
.btn:nth-child(2){ animation-delay:0.8s; }
.btn:nth-child(3){ animation-delay:1s; }

.btn:hover{
    background:rgba(255,255,255,0.35);
    transform:translateY(-4px);
    box-shadow:0 15px 30px rgba(0,0,0,0.6);
}

/* popup */
.popup{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.7);
    backdrop-filter:blur(15px);
    opacity:0;
    pointer-events:none;
    transition:0.3s ease;
}

.popup.active{
    opacity:1;
    pointer-events:auto;
}

.popup-content{
    padding:40px 60px;
    border-radius:20px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(40px);
    border:1px solid rgba(255,255,255,0.4);
    text-align:center;
    font-size:20px;
}

/* Анимации */
@keyframes glassAppear{
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

@keyframes btnAppear{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* адаптация */
@media(max-width:768px){
    .glass{
        padding:40px;
        width:90%;
    }
    .glass h1{
        font-size:40px;
    }
}
</style>
</head>

<body>

<video autoplay muted loop playsinline id="bgVideo">
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="glass">
    <h1>HAN</h1>
    <p>@hanmaybe</p>

    <div class="buttons">
        <a href="https://t.me/hanmaybee" target="_blank" class="btn">Telegram</a>
        <button class="btn" onclick="openPopup()">Project</button>
        <a href="https://youtube.com" target="_blank" class="btn">Just YouTube xdd)</a>
    </div>
</div>

<div class="popup" id="popup">
    <div class="popup-content">
        Скоро 🚀
        <br><br>
        <button class="btn" onclick="closePopup()">Закрыть</button>
    </div>
</div>

<script>
document.addEventListener("mousemove", function(e){
    let x=(window.innerWidth/2-e.pageX)/120;
    let y=(window.innerHeight/2-e.pageY)/120;
    document.getElementById("bgVideo").style.transform=
        "scale(1.05) translate("+x+"px,"+y+"px)";
});

function openPopup(){
    document.getElementById("popup").classList.add("active");
}
function closePopup(){
    document.getElementById("popup").classList.remove("active");
}
</script>

</body>
</html>
