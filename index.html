<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hanmaybe</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:white;
    overflow:hidden;
    background:#000;
}

/* ВИДЕО ФОН */
.video-bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

/* Затемнение */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    z-index:-1;
}

/* Контент */
.container{
    width:100%;
    max-width:600px;
    padding:20px;
}

h1{
    font-size:clamp(36px, 8vw, 72px);
    font-weight:900;
    letter-spacing:3px;
    color:#ffffff;
    margin-bottom:20px;
}

p{
    font-size:16px;
    color:#bbb;
    margin-bottom:40px;
    line-height:1.6;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
}

.buttons a,
.buttons button{
    padding:12px 22px;
    border-radius:30px;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(0,0,0,0.4);
    backdrop-filter:blur(8px);
    color:white;
    font-size:14px;
    text-decoration:none;
    cursor:pointer;
    transition:0.3s;
}

.buttons a:hover,
.buttons button:hover{
    background:rgba(255,255,255,0.15);
}

/* Модалка */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    pointer-events:none;
    transition:0.3s ease;
}

.modal.active{
    opacity:1;
    pointer-events:all;
}

.modal-box{
    padding:40px 60px;
    border-radius:20px;
    background:#111;
    font-size:22px;
}
</style>
</head>
<body>

<!-- ВИДЕО -->
<video class="video-bg" autoplay muted loop playsinline>
    <source src="background.mp4" type="video/mp4">
</video>

<!-- Затемнение -->
<div class="overlay"></div>

<div class="container">
    <h1>@hanmaybe</h1>

    <p>
        Digital creator. Minimal mind.<br>
        Building bots and quiet projects.
    </p>

    <div class="buttons">
        <a href="https://t.me/hanmaybe" target="_blank">Telegram</a>
        <button onclick="openGithub()">GitHub</button>
        <button onclick="openProjects()">Проекты</button>
    </div>
</div>

<div class="modal" id="modal" onclick="closeModal()">
    <div class="modal-box" id="modalText"></div>
</div>

<script>
function openGithub(){
    document.getElementById("modalText").innerText = "предпочитаю не говорить";
    document.getElementById("modal").classList.add("active");
}

function openProjects(){
    document.getElementById("modalText").innerText = "Скоро";
    document.getElementById("modal").classList.add("active");
}

function closeModal(){
    document.getElementById("modal").classList.remove("active");
}
</script>

</body>
</html>
