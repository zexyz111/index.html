<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Han</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    color:white;
}

/* Видео фон */
video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    filter:brightness(0.7) blur(2px) contrast(1.1);
}

/* Overlay */
.overlay{
    position:fixed;
    inset:0;
    background:radial-gradient(circle at center,
        rgba(0,0,0,0.25) 0%,
        rgba(0,0,0,0.65) 85%);
    z-index:-2;
}

/* 💎 Glass — затемнена ~18% */
.glass{
    padding:65px 90px;
    border-radius:35px;
    background:rgba(255,255,255,0.08); /* было 0.12 */
    backdrop-filter:blur(55px) saturate(160%);
    border:1px solid rgba(255,255,255,0.22); /* было 0.35 */
    box-shadow:
        0 20px 60px rgba(0,0,0,0.7);
    text-align:center;
    animation:fadeUp 1s ease forwards;
    opacity:0;
    transform:translateY(40px);
}

.glass h1{
    font-size:70px;
    letter-spacing:10px;
    transform:scaleX(1.4);
    display:inline-block;
}

.glass p{
    margin-top:15px;
    font-size:18px;
    opacity:0.85;
    letter-spacing:4px;
}

.buttons{
    margin-top:35px;
    display:flex;
    gap:18px;
    justify-content:center;
    flex-wrap:wrap;
}

.btn{
    padding:13px 28px;
    border-radius:18px;
    background:rgba(255,255,255,0.14);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.25);
    color:white;
    text-decoration:none;
    font-size:14px;
    letter-spacing:1px;
    cursor:pointer;
    transition:0.3s ease;
}

.btn:hover{
    background:rgba(255,255,255,0.25);
    transform:scale(1.05);
}

.popup{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.65);
    backdrop-filter:blur(15px);
    opacity:0;
    pointer-events:none;
    transition:0.4s ease;
}

.popup.active{
    opacity:1;
    pointer-events:auto;
}

.popup-content{
    padding:45px 70px;
    border-radius:25px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(35px);
    border:1px solid rgba(255,255,255,0.25);
    text-align:center;
    font-size:22px;
    transform:scale(0.9);
    transition:0.3s ease;
}

.popup.active .popup-content{
    transform:scale(1);
}

@keyframes fadeUp{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:768px){
    .glass{
        padding:45px;
        width:90%;
    }
    .glass h1{
        font-size:45px;
        transform:scaleX(1.3);
    }
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="glass">
    <h1>HAN</h1>
    <p>@hanmaybe</p>

    <div class="buttons">
        <a href="https://t.me/hanmaybee" target="_blank" class="btn">Telegram</a>
        <button class="btn" onclick="openPopup()">Project</button>
        <a href="https://youtube.com" target="_blank" class="btn">Just YouTube xdd)</a>
    </div>
</div>

<div class="popup" id="popup">
    <div class="popup-content">
        Скоро 🚀
        <br><br>
        <button class="btn" onclick="closePopup()">Закрыть</button>
    </div>
</div>

<script>
function openPopup(){
    document.getElementById("popup").classList.add("active");
}
function closePopup(){
    document.getElementById("popup").classList.remove("active");
}
</script>

</body>
</html>
