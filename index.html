<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Han</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
    color:white;
}

/* Видео фон */
video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-3;
    filter:brightness(0.7) blur(2px) contrast(1.1);
}

/* Overlay */
.overlay{
    position:fixed;
    inset:0;
    background:radial-gradient(circle at center,
        rgba(0,0,0,0.2) 0%,
        rgba(0,0,0,0.6) 85%);
    z-index:-2;
}

/* Glass */
.glass{
    padding:65px 90px;
    border-radius:35px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(55px) saturate(180%);
    border:1px solid rgba(255,255,255,0.35);
    box-shadow:
        0 0 80px rgba(255,255,255,0.15),
        0 25px 80px rgba(0,0,0,0.6);
    text-align:center;
    animation:fadeUp 1.2s ease forwards;
    opacity:0;
    transform:translateY(40px);
}

/* 🔥 HAN анимация */
.glass h1{
    font-size:70px;
    letter-spacing:10px;
    transform:scaleX(1.4);
    position:relative;
    display:inline-block;
    animation:
        textFade 1.4s ease forwards,
        textGlow 4s ease-in-out infinite 1.4s;
}

/* shimmer эффект */
.glass h1::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        120deg,
        transparent 30%,
        rgba(255,255,255,0.8),
        transparent 70%
    );
    transform:translateX(-120%);
    animation:shine 4s infinite 2s;
}

.glass p{
    margin-top:15px;
    font-size:18px;
    opacity:0.9;
    letter-spacing:4px;
}

.buttons{
    margin-top:35px;
    display:flex;
    gap:18px;
    justify-content:center;
    flex-wrap:wrap;
}

.btn{
    padding:13px 28px;
    border-radius:18px;
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(25px);
    border:1px solid rgba(255,255,255,0.45);
    color:white;
    text-decoration:none;
    font-size:14px;
    letter-spacing:1px;
    cursor:pointer;
    transition:all 0.3s ease;
}

.btn:hover{
    background:rgba(255,255,255,0.35);
    transform:scale(1.08);
    box-shadow:0 0 25px rgba(255,255,255,0.4);
}

/* Popup */
.popup{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(20px);
    opacity:0;
    pointer-events:none;
    transition:0.4s ease;
}

.popup.active{
    opacity:1;
    pointer-events:auto;
}

.popup-content{
    padding:45px 70px;
    border-radius:25px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(40px);
    border:1px solid rgba(255,255,255,0.4);
    text-align:center;
    font-size:22px;
    transform:scale(0.8);
    transition:0.4s ease;
}

.popup.active .popup-content{
    transform:scale(1);
}

/* Анимации */
@keyframes fadeUp{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes textFade{
    from{
        opacity:0;
        letter-spacing:30px;
    }
    to{
        opacity:1;
        letter-spacing:10px;
    }
}

@keyframes textGlow{
    0%,100%{
        text-shadow:
            0 0 20px rgba(255,255,255,0.8);
    }
    50%{
        text-shadow:
            0 0 40px rgba(255,255,255,1);
    }
}

@keyframes shine{
    0%{ transform:translateX(-120%); }
    50%{ transform:translateX(120%); }
    100%{ transform:translateX(120%); }
}

@media(max-width:768px){
    .glass{
        padding:45px;
        width:90%;
    }
    .glass h1{
        font-size:45px;
        transform:scaleX(1.3);
    }
}
</style>
</head>

<body>

<video autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="glass">
    <h1>HAN</h1>
    <p>@hanmaybe</p>

    <div class="buttons">
        <a href="https://t.me/hanmaybee" target="_blank" class="btn">Telegram</a>
        <button class="btn" onclick="openPopup()">Project</button>
        <a href="https://youtube.com" target="_blank" class="btn">Just YouTube xdd)</a>
    </div>
</div>

<div class="popup" id="popup">
    <div class="popup-content">
        Скоро 🚀
        <br><br>
        <button class="btn" onclick="closePopup()">Закрыть</button>
    </div>
</div>

<script>
function openPopup(){
    document.getElementById("popup").classList.add("active");
}
function closePopup(){
    document.getElementById("popup").classList.remove("active");
}
</script>

</body>
</html>
